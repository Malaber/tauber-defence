name: TauberDefenceApp
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  TauberDefenceCore:
    path: .
targets:
  TauberDefence:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      - path: Assets.xcassets
      - path: AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: TauberDefenceCore
        product: TauberDefenceCore
    settings:
      base:
        PRODUCT_NAME: Tauber Defence
        PRODUCT_BUNDLE_IDENTIFIER: de.malaber.tauberdefence
        DEVELOPMENT_TEAM: VWKG94374J
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        PROVISIONING_PROFILE_SPECIFIER: $(TAUBER_DEFENCE_APP_PROFILE_NAME)
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Tauber Defence
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
  TauberDefenceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: UITests
    dependencies:
      - target: TauberDefence
    settings:
      base:
        PRODUCT_NAME: TauberDefenceUITests
        PRODUCT_BUNDLE_IDENTIFIER: de.malaber.tauberdefence.ui-tests
        DEVELOPMENT_TEAM: VWKG94374J
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TauberDefence
schemes:
  TauberDefence:
    build:
      targets:
        TauberDefence: all
    test:
      gatherCoverageData: false
      targets:
        - name: TauberDefenceUITests
